<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloMentor — AI Practice Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --brand: #2563eb; --text: #1e293b;
            --dark-bg: #1e1e1e; --dark-text: #d4d4d4; --line: #e2e8f0;
        }
        body { font-family: 'DM+Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Setup Panel */
        .panel { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid var(--line); margin-bottom: 20px; }
        select, input { padding: 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 1rem; margin-right: 10px; }
        button { background: var(--brand); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }

        /* Practice Area */
        #practice-area { display: none; }
        .q-card { background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid var(--line); }
        .split-view { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        @media (max-width: 768px) { .split-view { grid-template-columns: 1fr; } }
        
        /* Playground */
        #code-editor { 
            width: 100%; height: 350px; background: var(--dark-bg); color: #9cdcfe; 
            font-family: 'JetBrains Mono', monospace; padding: 15px; border-radius: 8px; 
            border: none; margin-top: 20px; font-size: 14px; line-height: 1.5;
        }
        
        /* Image clarity */
        .diagram img { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
        .loading { font-style: italic; color: var(--brand); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>HelloMentor AI</h1>
        <p>Expert-level practice for any domain.</p>
    </header>

    <div id="setup-screen" class="panel">
        <h3>Configure Your Session</h3>
        <select id="domain">
            <option value="Medicaid UAT & Testing">Medicaid UAT</option>
            <option value="Machine Learning/NLP">Machine Learning</option>
            <option value="Full Stack Development">Full Stack Dev</option>
            <option value="Data Science">Data Science</option>
        </select>
        
        <select id="level">
            <option value="Basic">Basic</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Expert">Expert (Advanced)</option>
        </select>

        <input type="number" id="count" value="3" min="1" max="10" style="width: 60px;">
        <button onclick="startSession()">Start Interview</button>
    </div>

    <div id="practice-area">
        <div class="q-card">
            <div id="q-content"></div>
            <div id="input-area"></div>
            <div style="margin-top: 20px;">
                <button id="next-btn" onclick="nextQuestion()">Next Question</button>
                <button onclick="location.reload()" style="background:#64748b">End Session</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyAKZSpZdGAqxIftDrZYsw02i7QmddDIORg"; 
    let currentQuestions = [];
    let currentIndex = 0;
    let seenHistory = JSON.parse(localStorage.getItem('hm_history') || "[]");

    async function startSession() {
        const domain = document.getElementById('domain').value;
        const level = document.getElementById('level').value;
        const count = document.getElementById('count').value;
        
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('practice-area').style.display = 'block';
        document.getElementById('q-content').innerHTML = "<p class='loading'>AI is generating unique questions...</p>";

        const prompt = `Act as an expert in ${domain}. Generate ${count} unique interview questions for ${level} level. 
        For each question, decide if it's "speech", "code", or "image" based. 
        Return ONLY a JSON array: [{"text": "...", "type": "speech|code|image", "imageHint": "...", "keywords": ["..."]}]`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "");
            
            // Filter out repeated questions from history
            let newBatch = JSON.parse(text);
            currentQuestions = newBatch.filter(q => !seenHistory.includes(q.text));
            
            // Save to history
            currentQuestions.forEach(q => seenHistory.push(q.text));
            localStorage.setItem('hm_history', JSON.stringify(seenHistory.slice(-100)));

            renderQuestion();
        } catch (e) {
            document.getElementById('q-content').innerHTML = "Error: Check your API Key.";
        }
    }

    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        const content = document.getElementById('q-content');
        const inputArea = document.getElementById('input-area');
        
        content.innerHTML = `<h2>Question ${currentIndex + 1}</h2><p style="font-size:1.2rem">${q.text}</p>`;
        inputArea.innerHTML = "";

        if (q.type === 'code') {
            inputArea.innerHTML = `<textarea id="code-editor" placeholder="// Write your code here..."></textarea>`;
            // Tab support
            document.getElementById('code-editor').addEventListener('keydown', function(e) {
                if (e.key === 'Tab') { e.preventDefault(); let s = this.selectionStart; this.value = this.value.substring(0, s) + "    " + this.value.substring(this.selectionEnd); this.selectionEnd = s + 4; }
            });
        } else if (q.type === 'image') {
            const imgUrl = `https://pollinations.ai/p/${encodeURIComponent(q.imageHint)}?width=800&height=500&model=flux`;
            content.innerHTML = `<div class="split-view"><div>${content.innerHTML}</div><div class="diagram"><img src="${imgUrl}"></div></div>`;
            inputArea.innerHTML = `<button style="background:#059669">Record Answer</button>`;
        } else {
            inputArea.innerHTML = `<button style="background:#059669">Record Speech</button>`;
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            renderQuestion();
        } else {
            document.getElementById('q-content').innerHTML = "<h2>Session Complete!</h2><p>Excellent work. You've completed your expert practice.</p>";
            document.getElementById('input-area').innerHTML = "";
            document.getElementById('next-btn').style.display = "none";
        }
    }
</script>

</body>
</html>
