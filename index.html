<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloMentor AI | Expert Practice Platform</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .card { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 20px; }
        .settings-bar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: flex-end; }
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 1rem; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        #q-content { min-height: 200px; line-height: 1.6; }
        .editor { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; min-height: 150px; margin-top: 15px; outline: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>HelloMentor AI</h1>
        <p>Adaptive Practice for Students & Experts</p>
    </div>

    <div class="settings-bar">
        <input type="password" id="user-key" placeholder="Paste Gemini API Key Here">
    </div>

    <div id="setup-card" class="card">
        <h3>Prepare Your Session</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <select id="domain">
                <option value="Medicaid UAT & CMS Compliance">Medicaid UAT / CMS</option>
                <option value="Machine Learning (Tabular & NLP)">Machine Learning</option>
                <option value="Python Technical Interview">Python Coding</option>
                <option value="General Leadership & Change Management">Leadership (ADKAR)</option>
            </select>
            <select id="level">
                <option value="Student">Student (Foundational)</option>
                <option value="Senior Expert">Senior Expert (Critical Thinking)</option>
            </select>
        </div>
        <button onclick="startSession()" style="width: 100%;">Launch Teacher Mode</button>
    </div>

    <div id="practice-card" class="card hidden">
        <div id="q-content"></div>
        <div id="coding-area" class="hidden">
            <div class="editor" contenteditable="true" id="code-editor">// Write your solution here...</div>
        </div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button onclick="nextQuestion()">Next Challenge</button>
            <button onclick="endSession()" style="background: #64748b;">End Session</button>
        </div>
    </div>
</div>

<script>
    let pool = [];
    let curIdx = 0;

    async function startSession() {
        const key = document.getElementById('user-key').value;
        if (!key) { alert("Please paste your API key first!"); return; }

        const domain = document.getElementById('domain').value;
        const level = document.getElementById('level').value;
        
        document.getElementById('setup-card').classList.add('hidden');
        document.getElementById('practice-card').classList.remove('hidden');
        document.getElementById('q-content').innerHTML = "<h3>Teacher is analyzing your level and preparing challenges...</h3>";

        const prompt = `Act as an expert instructor in ${domain}. 
        Create 3 highly specific practice challenges for a ${level} level. 
        If expert, focus on edge cases, system failures, and compliance.
        Format your response ONLY as a JSON array: [{"text": "the question", "is_code": true/false}]`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!response.ok) throw new Error("API Connection Failed. Is the key valid?");

            const data = await response.json();
            const cleanText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "");
            pool = JSON.parse(cleanText);
            showQuestion();
        } catch (err) {
            document.getElementById('q-content').innerHTML = `<h3 style="color:red">Error: ${err.message}</h3>`;
        }
    }

    function showQuestion() {
        const q = pool[curIdx];
        document.getElementById('q-content').innerHTML = `<h2>Challenge ${curIdx + 1}</h2><p>${q.text}</p>`;
        
        const editor = document.getElementById('coding-area');
        q.is_code ? editor.classList.remove('hidden') : editor.classList.add('hidden');
    }

    function nextQuestion() {
        if (curIdx < pool.length - 1) {
            curIdx++;
            showQuestion();
        } else {
            document.getElementById('q-content').innerHTML = "<h2>Great Work!</h2><p>You have completed all challenges in this set.</p>";
        }
    }

    function endSession() {
        location.reload();
    }
</script>

</body>
</html>
